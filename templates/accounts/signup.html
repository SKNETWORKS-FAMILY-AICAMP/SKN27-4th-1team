{% load static %}
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>괴이 실록 - 가입</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  </head>
  <body class="bbs-page login-page">
    <main class="login-screen" aria-label="가입">
      <audio id="typingSound" preload="auto" loop>
        <source src="{% static 'audio/keyboard1.m4a' %}" type="audio/mp4" />
      </audio>
      <p id="signupPrompt" class="login-prompt" aria-live="polite"></p>

      <form class="login-form" action="{% url 'accounts:signup' %}" method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next|default:'' }}" />
        <label>
          <span>ID</span>
          <input type="text" name="username" value="{{ form.username.value|default:'' }}" autocomplete="username" />
        </label>
        <label>
          <span>PW</span>
          <input type="password" name="password" autocomplete="new-password" />
        </label>
        <label>
          <span>PW2</span>
          <input type="password" name="password_confirm" autocomplete="new-password" />
        </label>
        <label>
          <span>EMAIL</span>
          <input type="email" name="email" value="{{ form.email.value|default:'' }}" autocomplete="email" />
        </label>
        <div class="login-actions">
          <button type="submit">CREATE</button>
          <a href="{% url 'accounts:login' %}">BACK</a>
        </div>
      </form>
    </main>

    <script>
      const prompt = document.querySelector("#signupPrompt");
      const typingSound = document.querySelector("#typingSound");
      const serverError = "{{ error|default:'' }}";
      const message = serverError || "기록자가 되시겠습니까?";
      let index = 0;

      function startTypingSound() {
        typingSound.currentTime = 0;
        typingSound.volume = 0.55;
        typingSound.play().catch(() => {});
      }

      function stopTypingSound() {
        typingSound.pause();
        typingSound.currentTime = 0;
      }

      function typeNextLetter() {
        prompt.textContent = message.slice(0, index);
        index += 1;

        if (index <= message.length) {
          window.setTimeout(typeNextLetter, 130);
        } else {
          stopTypingSound();
        }
      }

      window.setTimeout(() => {
        startTypingSound();
        typeNextLetter();
      }, 420);

      document.querySelector(".login-form").addEventListener("submit", () => {
        const csrfInput = document.querySelector('[name="csrfmiddlewaretoken"]');
        const csrfCookie = document.cookie.split("; ").find((item) => item.startsWith("csrftoken="));
        if (csrfInput && csrfCookie) {
          csrfInput.value = decodeURIComponent(csrfCookie.split("=")[1]);
        }
      });
    </script>
    <script src="{% static 'js/flicker.js' %}"></script>
  </body>
</html>
