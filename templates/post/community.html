{% load static %}
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>괴이 실록 - 열린 게시판</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  </head>
  <body class="bbs-page">
    <main class="bbs-screen">
      <header class="bbs-topbar">
        <span>archive://goei.sillok/witness</span>
        <span>열린 게시판</span>
        <a class="bbs-login" href="{% url 'accounts:login' %}">LOGIN</a>
      </header>
      <nav class="bbs-nav" aria-label="괴이실록 페이지">
        <a href="{% url 'archive:sillokgwan' %}">[ 1. 기록 열람실 ]</a>
        <a href="{% url 'archive:geumgirok' %}">[ 2. 금기 자료실 ]</a>
        <a href="{% url 'generator:goeijejoso' %}">[ 3. 신규 기록실 ]</a>
        <a href="{% url 'post:mokgyeokgirok' %}">[ 4. 열린 게시판 ]</a>
        <a href="{% url 'regions:jidogam' %}">[ 5. 지역 정보실 ]</a>
        <a href="{% url 'accounts:mypage' %}">[ 6. 나의 보관함 ]</a>
      </nav>
      <section class="community-shell" aria-label="괴이실록 열린 게시판">
        <header class="community-header">
          <div>
            <h1>열린 게시판</h1>
            <p>목격담과 창작담이 올라오는 괴이실록 커뮤니티</p>
          </div>
          <button class="write-button" id="writeButton" type="button">글쓰기</button>
        </header>

        <div class="community-tabs" role="tablist" aria-label="열린 게시판 종류">
          <button id="witnessBoardTab" class="community-tab active" type="button" role="tab" aria-selected="true" aria-controls="witnessBoard">목격담</button>
          <button id="creationBoardTab" class="community-tab" type="button" role="tab" aria-selected="false" aria-controls="creationBoard">창작담</button>
        </div>

        <form class="write-panel" id="writePanel" hidden>
          <label>
            <span>제목</span>
            <input id="postTitle" type="text" placeholder="예: 복도 끝에서 본 사람" />
          </label>
          <label>
            <span>지역</span>
            <input id="postRegion" type="text" placeholder="예: 부산 영도구" />
          </label>
          <label>
            <span>내용</span>
            <textarea id="postBody" rows="5" placeholder="목격한 내용을 기록하십시오"></textarea>
          </label>
          <div class="write-actions">
            <button type="submit">등록</button>
            <button type="button" id="cancelWrite">취소</button>
          </div>
        </form>

        <div class="post-list active" id="witnessBoard" tabindex="0" role="tabpanel" aria-labelledby="witnessBoardTab" aria-label="목격담 목록">
          <button
            class="post-card"
            type="button"
            data-meta="#0007 / 서울 마포구 / 조회 182"
            data-body="옥상 문이 잠긴 뒤에도 위층에서 누군가 내려오는 소리가 납니다. 발소리는 4층에서 멈추고, 그때 복도 센서등이 꺼집니다. 관리실 CCTV에는 아무도 찍히지 않았지만, 계단 난간에는 젖은 손자국이 남아 있었습니다."
          >
            <div class="post-meta"><span>#0007</span><span>서울 마포구</span><span>조회 182</span></div>
            <h2>새벽마다 같은 계단을 내려오는 발소리</h2>
            <p>옥상 문이 잠긴 뒤에도 위층에서 누군가 내려오는 소리가 납니다. 발소리는 4층에서 멈추고, 그때 복도 센서등이 꺼집니다.</p>
          </button>
          <button
            class="post-card"
            type="button"
            data-meta="#0006 / 대구 중구 / 조회 97"
            data-body="철거된 줄 알았던 공중전화가 비 오는 날만 골목에 나타납니다. 수화기를 들면 자기 목소리로 집 주소를 말합니다. 전화를 끊으면 부스 유리에 안쪽에서 찍힌 듯한 젖은 손자국이 생깁니다."
          >
            <div class="post-meta"><span>#0006</span><span>대구 중구</span><span>조회 97</span></div>
            <h2>공중전화 부스 안쪽의 젖은 손자국</h2>
            <p>철거된 줄 알았던 공중전화가 비 오는 날만 골목에 나타납니다. 수화기를 들면 자기 목소리로 집 주소를 말합니다.</p>
          </button>
          <button
            class="post-card"
            type="button"
            data-meta="#0005 / 강원 인제 / 조회 211"
            data-body="터널 안에서는 모든 주파수가 끊기는데, 03:12에만 낯선 안내 방송이 나옵니다. 마지막에 제 이름을 불렀습니다. 다음 날 차량 블랙박스에는 터널 중간에 서 있던 사람이 조수석을 바라보는 장면이 남아 있었습니다."
          >
            <div class="post-meta"><span>#0005</span><span>강원 인제</span><span>조회 211</span></div>
            <h2>터널 중간에서 라디오가 잡은 이름</h2>
            <p>터널 안에서는 모든 주파수가 끊기는데, 03:12에만 낯선 안내 방송이 나옵니다. 마지막에 제 이름을 불렀습니다.</p>
          </button>
          <button
            class="post-card"
            type="button"
            data-meta="#0004 / 전북 군산 / 조회 144"
            data-body="폐가를 찍은 사진을 넘길수록 창문 안쪽의 사람이 한 칸씩 앞으로 옵니다. 마지막 사진은 아직 열어보지 않았습니다. 파일 이름은 자동으로 '다음은 네 방'으로 바뀌어 있었습니다."
          >
            <div class="post-meta"><span>#0004</span><span>전북 군산</span><span>조회 144</span></div>
            <h2>사진마다 한 칸씩 가까워지는 사람</h2>
            <p>폐가를 찍은 사진을 넘길수록 창문 안쪽의 사람이 한 칸씩 앞으로 옵니다. 마지막 사진은 아직 열어보지 않았습니다.</p>
          </button>
          <button
            class="post-card"
            type="button"
            data-meta="#0003 / 경기 수원 / 조회 128"
            data-body="버튼에는 없는데 표시창에만 B4가 뜹니다. 문이 열리면 항상 같은 안내문이 붙어 있습니다. '돌아가지 마시오.' 닫힘 버튼을 누른 뒤에도 문틈으로 같은 안내문이 점점 가까워졌습니다."
            data-owned="true"
          >
            <div class="post-meta"><span>#0003</span><span>경기 수원</span><span>조회 128</span></div>
            <h2>엘리베이터에 없는 지하 4층</h2>
            <p>버튼에는 없는데 표시창에만 B4가 뜹니다. 문이 열리면 항상 같은 안내문이 붙어 있습니다. '돌아가지 마시오.'</p>
          </button>
        </div>

        <div class="post-list creation-list" id="creationBoard" tabindex="0" role="tabpanel" aria-labelledby="creationBoardTab" aria-label="창작담 목록" hidden>
          <button
            class="post-card creation-card"
            type="button"
            data-meta="#C012 / 도시전설 / 추천 31"
            data-body="검색어를 입력하면 결과가 아니라 사용자의 내일 일정이 뜹니다. 가장 아래에는 항상 삭제할 수 없는 방문 기록이 남습니다. 방문 기록의 마지막 주소는 아직 만들어지지 않은 사용자의 무덤 페이지입니다."
          >
            <div class="post-meta"><span>#C012</span><span>도시전설</span><span>추천 31</span></div>
            <h2>새벽 세 시에만 열리는 검색창</h2>
            <p>검색어를 입력하면 결과가 아니라 사용자의 내일 일정이 뜹니다. 가장 아래에는 항상 삭제할 수 없는 방문 기록이 남습니다.</p>
          </button>
          <button
            class="post-card creation-card"
            type="button"
            data-meta="#C011 / 도플갱어 / 추천 18"
            data-body="사진 속 얼굴이 하루에 한 번씩 표정을 바꿉니다. 일주일 뒤에는 사진 속 사람이 먼저 로그인합니다. 비밀번호는 사용자가 평생 쓰지 않았지만 잊은 적 없는 단어였습니다."
            data-owned="true"
          >
            <div class="post-meta"><span>#C011</span><span>도플갱어</span><span>추천 18</span></div>
            <h2>프로필 사진을 바꾸지 마세요</h2>
            <p>사진 속 얼굴이 하루에 한 번씩 표정을 바꿉니다. 일주일 뒤에는 사진 속 사람이 먼저 로그인합니다.</p>
          </button>
          <button
            class="post-card creation-card"
            type="button"
            data-meta="#C010 / 저주 / 추천 26"
            data-body="괴담 끝의 각주는 독자마다 다르게 보입니다. 자신의 이름이 적힌 각주를 읽은 사람은 다음 이야기에 등장합니다. 각주를 지우려면 아직 쓰이지 않은 결말을 먼저 읽어야 합니다."
          >
            <div class="post-meta"><span>#C010</span><span>저주</span><span>추천 26</span></div>
            <h2>읽은 사람만 보이는 각주</h2>
            <p>괴담 끝의 각주는 독자마다 다르게 보입니다. 자신의 이름이 적힌 각주를 읽은 사람은 다음 이야기에 등장합니다.</p>
          </button>
        </div>
      </section>
    </main>
    <script>
      const writeButton = document.querySelector("#writeButton");
      const writePanel = document.querySelector("#writePanel");
      const cancelWrite = document.querySelector("#cancelWrite");
      const boardTabs = document.querySelectorAll(".community-tab");
      const postLists = document.querySelectorAll(".post-list");
      const postTitle = document.querySelector("#postTitle");
      const postRegion = document.querySelector("#postRegion");
      const postBody = document.querySelector("#postBody");
      let activeBoard = "witnessBoard";
      let postNumber = 8;
      let creationNumber = 13;

      boardTabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          activeBoard = tab.getAttribute("aria-controls");

          boardTabs.forEach((item) => {
            item.classList.toggle("active", item === tab);
            item.setAttribute("aria-selected", String(item === tab));
          });

          postLists.forEach((list) => {
            const isActive = list.id === activeBoard;
            list.classList.toggle("active", isActive);
            list.hidden = !isActive;
          });

          closeExpandedPosts();
        });
      });

      function closeExpandedPosts() {
        document.querySelectorAll(".post-card.expanded").forEach((card) => card.classList.remove("expanded"));
        document.querySelectorAll(".post-detail").forEach((detail) => detail.remove());
      }

      function buildOwnerActions(card, detail, body) {
        if (card.dataset.owned !== "true") {
          return;
        }

        const actions = document.createElement("div");
        const editButton = document.createElement("button");
        const deleteButton = document.createElement("button");

        actions.className = "record-actions";
        editButton.className = "record-action-button edit-action";
        editButton.type = "button";
        editButton.textContent = "수정";
        deleteButton.className = "record-action-button delete-action";
        deleteButton.type = "button";
        deleteButton.textContent = "삭제";

        editButton.addEventListener("click", () => {
          if (detail.querySelector(".inline-edit-form")) {
            return;
          }

          const editPanel = document.createElement("form");
          const titleLabel = document.createElement("label");
          const titleText = document.createElement("span");
          const titleInput = document.createElement("input");
          const bodyLabel = document.createElement("label");
          const bodyText = document.createElement("span");
          const bodyInput = document.createElement("textarea");
          const editControls = document.createElement("div");
          const saveButton = document.createElement("button");
          const cancelButton = document.createElement("button");

          editPanel.className = "inline-edit-form";
          titleText.textContent = "제목";
          titleInput.type = "text";
          titleInput.value = card.querySelector("h2")?.textContent ?? "";
          bodyText.textContent = "내용";
          bodyInput.rows = 5;
          bodyInput.value = card.dataset.body ?? "";
          editControls.className = "inline-edit-actions";
          saveButton.className = "record-action-button save-action";
          saveButton.type = "submit";
          saveButton.textContent = "저장";
          cancelButton.className = "record-action-button";
          cancelButton.type = "button";
          cancelButton.textContent = "취소";

          titleLabel.append(titleText, titleInput);
          bodyLabel.append(bodyText, bodyInput);
          editControls.append(saveButton, cancelButton);
          editPanel.append(titleLabel, bodyLabel, editControls);

          editPanel.addEventListener("submit", (event) => {
            event.preventDefault();
            const nextTitle = titleInput.value.trim();
            const nextBody = bodyInput.value.trim();

            if (!nextTitle || !nextBody) {
              window.alert("제목과 내용을 모두 입력해 주세요.");
              return;
            }

            const titleNode = card.querySelector("h2");
            const previewNode = card.querySelector("p");
            card.dataset.body = nextBody;
            body.textContent = nextBody;

            if (titleNode) {
              titleNode.textContent = nextTitle;
            }

            if (previewNode) {
              previewNode.textContent = nextBody;
            }

            editPanel.remove();
          });

          cancelButton.addEventListener("click", () => {
            editPanel.remove();
          });

          detail.insertBefore(editPanel, actions);
          titleInput.focus();
        });

        deleteButton.addEventListener("click", () => {
          if (!window.confirm("이 글을 삭제하시겠습니까?")) {
            return;
          }

          detail.remove();
          card.remove();
        });

        actions.append(editButton, deleteButton);
        detail.append(actions);
      }

      function bindPostCard(card) {
        card.addEventListener("click", () => {
          const isExpanded = card.classList.contains("expanded");

          closeExpandedPosts();
          if (isExpanded) return;

          const detail = document.createElement("div");
          const meta = document.createElement("p");
          const body = document.createElement("p");

          detail.className = "post-detail";
          meta.className = "detail-meta";
          meta.textContent = card.dataset.meta;
          body.className = "detail-body";
          body.textContent = card.dataset.body;

          detail.append(meta, body);
          buildOwnerActions(card, detail, body);
          card.classList.add("expanded");
          card.insertAdjacentElement("afterend", detail);
        });
      }

      document.querySelectorAll(".post-card").forEach(bindPostCard);

      writeButton.addEventListener("click", () => {
        writePanel.hidden = false;
        postTitle.focus();
      });

      cancelWrite.addEventListener("click", () => {
        writePanel.hidden = true;
      });

      writePanel.addEventListener("submit", (event) => {
        event.preventDefault();

        const title = postTitle.value.trim() || "제목 없는 목격담";
        const region = postRegion.value.trim() || "지역 미상";
        const body = postBody.value.trim() || "내용이 삭제된 기록입니다.";
        const targetList = document.querySelector(`#${activeBoard}`);
        const isCreation = activeBoard === "creationBoard";
        const card = document.createElement("button");
        const meta = document.createElement("div");
        const number = document.createElement("span");
        const regionLabel = document.createElement("span");
        const views = document.createElement("span");
        const heading = document.createElement("h2");
        const text = document.createElement("p");

        card.className = isCreation ? "post-card creation-card" : "post-card";
        card.type = "button";
        card.dataset.owned = "true";
        meta.className = "post-meta";
        number.textContent = isCreation ? `#C${String(creationNumber).padStart(3, "0")}` : `#${String(postNumber).padStart(4, "0")}`;
        regionLabel.textContent = isCreation ? "창작담" : region;
        views.textContent = isCreation ? "추천 0" : "조회 0";
        card.dataset.meta = isCreation
          ? `${number.textContent} / 창작담 / 추천 0`
          : `${number.textContent} / ${region} / 조회 0`;
        card.dataset.body = body;
        heading.textContent = title;
        text.textContent = body;

        meta.append(number, regionLabel, views);
        card.append(meta, heading, text);
        bindPostCard(card);
        targetList.prepend(card);
        if (isCreation) {
          creationNumber += 1;
        } else {
          postNumber += 1;
        }
        writePanel.reset();
        writePanel.hidden = true;
      });
    </script>
    <script src="{% static 'js/flicker.js' %}"></script>
  </body>
</html>
